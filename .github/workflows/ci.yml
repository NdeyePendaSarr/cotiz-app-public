# Contrôle automatique de chaque push. Aucun secret : tout tourne sur un Supabase local jetable,
# dont les clés sont générées ici. Aucune donnée de production n'est jamais lue.
name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      # PageProps et LayoutProps sont générés par Next dans .next/types, absent d'une machine neuve.
      - name: TypeScript
        run: |
          npx next typegen
          npx tsc --noEmit

      - name: Tests unitaires
        run: npm test

      - name: Démarrer Supabase local
        run: npx supabase start

      - name: Écrire le .env local
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo 'DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"'
            echo 'DIRECT_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"'
            echo 'NEXT_PUBLIC_SUPABASE_URL="http://127.0.0.1:54321"'
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\"$PUBLISHABLE_KEY\""
            echo "SUPABASE_SERVICE_ROLE_KEY=\"$SECRET_KEY\""
          } > .env

      - name: Appliquer les migrations
        run: npx prisma migrate deploy

      - name: Tests d'intégration
        run: npm run test:isolation

      - name: Build de production
        run: npm run build
